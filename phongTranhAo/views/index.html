<!DOCTYPE html>
<html>
<head>
    <title>Trường Đại học Thủ Dầu Một</title>
    <link rel="icon" type="image/x-icon" href="/images_core/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.7);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.9);
        }
        .control-btn:active {
            background: rgba(200,200,200,0.9);
        }
        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #down { grid-column: 2; grid-row: 3; }
        #rotate-left { grid-column: 1; grid-row: 1; }
        #rotate-right { grid-column: 3; grid-row: 1; }
        #touchArea {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 70vh;
            z-index: 1;
        }
        #rotate-left, #rotate-right {
            display: block;
        }
        /* Media query cho mobile */
        @media (max-width: 768px) {
            #touchArea {
                display: block;
            }
            #rotate-left, #rotate-right {
                display: none;
            }
            #controls {
                grid-template-columns: repeat(3, 40px);
                grid-template-rows: repeat(2, 40px);
                bottom: 10px;
                right: 10px;
            }
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            #up { grid-column: 2; grid-row: 1; }
            #left { grid-column: 1; grid-row: 2; }
            #right { grid-column: 3; grid-row: 2; }
            #down { grid-column: 2; grid-row: 2; }
        }
        /* Ngăn chặn việc chọn text khi touch */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        #interactHint {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 30%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial;
            font-size: 24px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 5px;
        }

        #paintingInfo {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1000;
        }

        #paintingInfo img {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
        }

        #paintingInfo h2 {
            margin: 0 0 10px 0;
            color: #333;
        }

        #paintingInfo p {
            margin: 0 0 15px 0;
            color: #666;
            line-height: 1.5;
        }

        #closeButton {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }

        /* Thêm style cho nút info */
        #infoButton {
            display: none; /* Ẩn mặc định */
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.7);
            color: #333;
            font-size: 20px;
            position: absolute;
            bottom: 20px;
            right: 70px;
            cursor: pointer;
            z-index: 1000;
        }

        /* Điều chỉnh media query */
        @media (max-width: 768px) {
            /* ... các style mobile hiện tại ... */
            
            #interactHint {
                display: none !important; /* Luôn ẩn hint trên mobile */
            }
            
            #infoButton {
                display: none; /* Sẽ hiện khi ở gần tranh */
                bottom: 70px; /* Điều chỉnh vị trí phù hợp với layout mobile */
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="touchArea"></div>
    <div id="info">
        Use W,A,S,D keys to move, and mouse/touch to look around
    </div>
    <div id="controls">
        <button id="rotate-left" class="control-btn">↺</button>
        <button id="up" class="control-btn">↑</button>
        <button id="rotate-right" class="control-btn">↻</button>
        <button id="left" class="control-btn">←</button>
        <button id="down" class="control-btn">↓</button>
        <button id="right" class="control-btn">→</button>
    </div>
    <div id="interactHint">Nhấn G để xem chi tiết</div>
    <div class="overlay" id="overlay"></div>
    <div id="paintingInfo">
        <button id="closeButton">&times;</button>
        <img id="paintingImage" src="" alt="Artwork">
        <h2 id="paintingTitle"></h2>
        <p id="paintingDescription"></p>
    </div>
    <button id="infoButton" class="control-btn">ℹ️</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="js/gallery.js"></script>
    <script>
        const room = window.location.pathname.substring(1);
        let message;
        
        switch(room) {
            case '1':
                message = 'Công tác giáo dục';
                break;
            case '2': 
                message = 'Tổ chức các phong trào hành động cách mạng phát huy vai trò xung kích, tình nguyện, sáng tạo';
                break;
            case '3':
                message = 'Tổ chức các chương trình đồng hành với thanh niên';
                break;
            case '4':
                message = 'Công tác xây dựng Đoàn, mở rộng mặt trận đoàn kết tập hợp thanh niên';
                break;
            default:
                message = `Use W,A,S,D keys to move, and mouse/touch to look around`;
        }
        
        document.getElementById('info').textContent = message;
     </script>
</body>
</html>
